# Cloudflare Workers config. `npm run dev` runs this locally (with a local KV
# simulation); `npm run deploy` or a connected Git repo ships it.
name = "custom-survey"
main = "worker.js"
compatibility_date = "2025-06-01"

# Serve public/ as static assets; requests that don't match a file fall through
# to the Worker (which handles /api/*).
[assets]
directory = "./public"

# Vote storage.  Create the namespace once:  npx wrangler kv namespace create SURVEY_KV
# The id is a resource handle, NOT a secret — it does nothing without an API
# token scoped to this account, and Cloudflare expects it in this committed
# file. Safe to leave here.
[[kv_namespaces]]
binding = "SURVEY_KV"
id = "394f3b730da7492eb99afe96e70e1664"

# Per-client write rate limiting (Workers-native, free). Caps POST/DELETE
# /api/vote at `limit` requests per `period` seconds per IP. The code treats
# this as optional — if a deploy ever rejects this block, delete it and add a
# rate-limit rule in the dashboard WAF instead.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Secrets — set with `npx wrangler secret put <NAME>`, never written here:
#   ADMIN_KEY   gates GET /api/results?key=...
#   CONFIG      (optional) real event config as a JSON string; overrides the
#               committed demo config.json at runtime
